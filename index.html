<script>
/* ============================================================
   极简 React 风格运行时:useState + 增量 diff + h() 超脚本
   ============================================================ */
const root = document.getElementById('root');
let hookStates = [];
let hookIndex = 0;
let scheduled = false;

function useState(initial) {
  const i = hookIndex++;
  if (hookStates[i] === undefined) {
    hookStates[i] = typeof initial === 'function' ? initial() : initial;
  }
  const setter = (v) => {
    hookStates[i] = typeof v === 'function' ? v(hookStates[i]) : v;
    scheduleRender();
  };
  return [hookStates[i], setter];
}
function scheduleRender() {
  if (scheduled) return;
  scheduled = true;
  Promise.resolve().then(() => { scheduled = false; doRender(); });
}
function doRender() {
  hookIndex = 0;
  const tree = App();
  reconcile(root, [tree]);   // 增量 diff,而非整树重建 —— 避免每次操作动画重放/闪烁
}
function h(tag, props, ...children) {
  return { tag, props: props || {}, children: children.flat(Infinity).filter(c => c != null && c !== false) };
}
function isText(v) { return typeof v === 'string' || typeof v === 'number'; }
function keyOf(v) { return (v && v.props && v.props.key != null) ? v.props.key : null; }

function setProp(el, k, ov, nv) {
  if (k === 'key' || k === 'ref') return;
  if (k === 'style') { updateStyle(el, ov || {}, nv || {}); return; }
  if (k === 'className') { if (nv !== ov) el.className = nv || ''; return; }
  if (k === 'value') { const v = nv == null ? '' : nv; if (el.value !== v) el.value = v; return; }  // 受控输入:走 .value 属性
  if (k.startsWith('on')) {
    const ev = k.slice(2).toLowerCase();
    el._handlers = el._handlers || {};
    if (el._handlers[ev]) { el.removeEventListener(ev, el._handlers[ev]); delete el._handlers[ev]; }
    if (typeof nv === 'function') { el.addEventListener(ev, nv); el._handlers[ev] = nv; }
    return;
  }
  if (nv !== ov) {
    if (nv == null || nv === false) el.removeAttribute(k);
    else el.setAttribute(k, nv);
  }
}
function updateStyle(el, oldS, newS) {
  for (const k in oldS) { if (!(k in newS)) { if (k.startsWith('--')) el.style.removeProperty(k); else el.style[k] = ''; } }
  for (const k in newS) { if (newS[k] !== oldS[k]) { if (k.startsWith('--')) el.style.setProperty(k, newS[k]); else el.style[k] = newS[k]; } }
}
function updateProps(el, oldP, newP) {
  oldP = oldP || {}; newP = newP || {};
  for (const k in oldP) { if (!(k in newP)) setProp(el, k, oldP[k], undefined); }
  for (const k in newP) { setProp(el, k, oldP[k], newP[k]); }
}
function createDom(vnode) {
  if (isText(vnode)) return document.createTextNode(String(vnode));
  const el = document.createElement(vnode.tag);
  updateProps(el, {}, vnode.props);
  (vnode.children || []).forEach(c => el.appendChild(createDom(c)));
  el._vchildren = vnode.children || [];
  return el;
}
function compatible(ov, nv) {
  // 可原地复用:同为文本,或同标签且同 key —— 否则需新建
  if (isText(ov) || isText(nv)) return isText(ov) && isText(nv);
  return ov.tag === nv.tag && keyOf(ov) === keyOf(nv);
}
function patchNode(dom, ov, nv) {
  if (isText(ov) && isText(nv)) {
    if (String(ov) !== String(nv)) dom.nodeValue = String(nv);
    return;
  }
  updateProps(dom, ov.props, nv.props);
  reconcile(dom, nv.children);
}
// 带 key 的协调:按 key 匹配复用,无 key 的按同位下标匹配,最后按新顺序就位。
// 这样在中间插入/删除条件节点(如错题解释面板)不会错位污染相邻兄弟。
function reconcile(parent, newChildren) {
  newChildren = (newChildren || []).filter(c => c != null && c !== false);
  const oldChildren = parent._vchildren || [];
  const oldDom = [];
  for (let i = 0; i < oldChildren.length; i++) oldDom.push(parent.childNodes[i]);
  const oldByKey = new Map();
  oldChildren.forEach((v, i) => { const k = keyOf(v); if (k != null) oldByKey.set(k, i); });
  const used = new Array(oldChildren.length).fill(false);
  const resultDoms = [];
  for (let i = 0; i < newChildren.length; i++) {
    const nv = newChildren[i];
    const k = keyOf(nv);
    let oi = -1;
    if (k != null) { if (oldByKey.has(k)) oi = oldByKey.get(k); }
    else if (oldChildren[i] != null && keyOf(oldChildren[i]) == null) oi = i;
    let dom;
    if (oi >= 0 && !used[oi] && oldDom[oi] && compatible(oldChildren[oi], nv)) {
      patchNode(oldDom[oi], oldChildren[oi], nv);
      dom = oldDom[oi]; used[oi] = true;
    } else {
      dom = createDom(nv);   // 新建(动画借此按需触发)
    }
    resultDoms.push(dom);
  }
  // 删除未被复用的旧节点
  for (let i = 0; i < oldDom.length; i++) {
    if (!used[i] && oldDom[i] && oldDom[i].parentNode === parent) parent.removeChild(oldDom[i]);
  }
  // 按新顺序就位(insertBefore 会移动已存在节点)
  for (let i = 0; i < resultDoms.length; i++) {
    const d = resultDoms[i];
    if (parent.childNodes[i] !== d) parent.insertBefore(d, parent.childNodes[i] || null);
  }
  parent._vchildren = newChildren;
}

/* ============================================================
   Web Audio 合成音效
   ============================================================ */
let actx = null;
function getCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function playCorrect() {
  try {
    const ctx = getCtx(), now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const t = now + i * 0.07;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function playWrong() {
  try {
    const ctx = getCtx(), now = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(170, now);
    o.frequency.exponentialRampToValueAtTime(70, now + 0.25);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    o.start(now); o.stop(now + 0.31);
  } catch (e) {}
}
function playCombo() {
  try {
    const ctx = getCtx(), now = ctx.currentTime;
    [659.25, 880, 1046.5, 1318.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = f;
      o.connect(g); g.connect(ctx.destination);
      const t = now + i * 0.06;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.start(t); o.stop(t + 0.18);
    });
  } catch (e) {}
}

/* ============================================================
   工具
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function daysToExam() {
  const exam = new Date('2026-06-13T00:00:00');
  const now = new Date();
  const d = Math.ceil((exam - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  return d;
}

const BRIGHT = "#a855f7";   // 亮紫(高光/粒子)
const MUTED  = "#8b7fb0";   // 次要文字
const INK    = "#3b2d5e";   // 正文
const GREEN  = "#16a34a";   // 正确
const RED    = "#dc2626";   // 错误
const PANEL  = "#ffffff";

const SHADOW = "0 6px 22px rgba(124,58,237,0.10)";

// 全局 ESC / 取词 监听(只挂一次)
const appApi = { toggleDisguise: () => {}, lookup: () => {} };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); appApi.toggleDisguise(); }
});
// 取词:优先用已选中的文本(支持词组),否则取点击处的单词
function termAt(x, y) {
  const sel = (window.getSelection ? String(window.getSelection()) : '').trim();
  if (sel && sel.length >= 2 && sel.length <= 48 && /[A-Za-z]/.test(sel)) return sel;
  return wordAtPoint(x, y);
}
// 右键(桌面)取词/取词组查释义并可收藏
document.addEventListener('contextmenu', (e) => {
  const w = termAt(e.clientX, e.clientY);
  if (w) { e.preventDefault(); appApi.lookup(w, e.clientX, e.clientY); }
});
// 长按(移动端)取词查释义
let _lpTimer = null, _lpX = 0, _lpY = 0;
document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0]; _lpX = t.clientX; _lpY = t.clientY;
  _lpTimer = setTimeout(() => {
    const w = termAt(_lpX, _lpY);
    if (w) appApi.lookup(w, _lpX, _lpY);
  }, 500);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (_lpTimer && e.touches.length === 1) {
    const t = e.touches[0];
    if (Math.abs(t.clientX - _lpX) > 10 || Math.abs(t.clientY - _lpY) > 10) { clearTimeout(_lpTimer); _lpTimer = null; }
  }
}, { passive: true });
document.addEventListener('touchend', () => { if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; } });

/* ============================================================
   App
   ============================================================ */
function App() {
  // —— 全局
  const [screen, setScreen] = useState('menu');     // menu | translate | pattern | synonym
  const [disguise, setDisguise] = useState(false);
  const [todayCount, setTodayCount] = useState(0);
  const [combo, setCombo] = useState(0);
  const [fx, setFx] = useState(null);               // 'correct' | 'wrong' | null
  const [comboMsg, setComboMsg] = useState(null);

  // —— 翻译速拼
  const [tIndex, setTIndex] = useState(0);
  const [tHist, setTHist] = useState([0]);          // 本次做题历史(题号序列)
  const [tHp, setTHp] = useState(0);                // 历史指针
  const [tShuffle, setTShuffle] = useState(() => makeShuffle(0));
  const [tPicked, setTPicked] = useState([]);       // 存 tShuffle 下标
  const [tShowWrong, setTShowWrong] = useState(false);
  const [tRight, setTRight] = useState(false);      // 答对后展示考点、停留巩固

  // —— 句式点亮
  const [pIndex, setPIndex] = useState(0);
  const [pHist, setPHist] = useState([0]);
  const [pHp, setPHp] = useState(0);
  const [pLit, setPLit] = useState(() => Array(PATTERNS.length).fill(false));
  const [pChosen, setPChosen] = useState(null);

  // —— 同义替换
  const [sBatch, setSBatch] = useState(0);
  const [sOrder, setSOrder] = useState(() => shuffle([0, 1, 2, 3, 4, 5, 6, 7]));
  const [sMatched, setSMatched] = useState(() => Array(8).fill(false));
  const [sSel, setSSel] = useState(null);
  const [sWrongPair, setSWrongPair] = useState([]);
  const [sStart, setSStart] = useState(() => Date.now());
  const [sDone, setSDone] = useState(false);
  const [sElapsed, setSElapsed] = useState(0);
  const [sHint, setSHint] = useState(null);

  // —— 固定搭配
  const [colIndex, setColIndex] = useState(0);
  const [colHist, setColHist] = useState([0]);
  const [colHp, setColHp] = useState(0);
  const [colChosen, setColChosen] = useState(null);

  // —— 作文模板(默写检查)
  const [tmplIdx, setTmplIdx] = useState(0);
  const [tmplHist, setTmplHist] = useState([0]);
  const [tmplHp, setTmplHp] = useState(0);
  const [tmplInput, setTmplInput] = useState('');
  const [tmplChecked, setTmplChecked] = useState(false);
  const [tmplDone, setTmplDone] = useState(() => Array(ESSAY_TEMPLATES.length).fill(false));

  // —— 作文构思(自己输入思路 → 对照范例)
  const [oIndex, setOIndex] = useState(0);
  const [oHist, setOHist] = useState([0]);
  const [oHp, setOHp] = useState(0);
  const [oInput, setOInput] = useState('');
  const [oRevealed, setORevealed] = useState(false);

  // —— 收藏(localStorage 持久化):favs=题目收藏, wordFavs=单词/词组收藏
  const [favs, setFavs] = useState(() => { try { return JSON.parse(localStorage.getItem('cet6_favs') || '[]'); } catch (e) { return []; } });
  const [wordFavs, setWordFavs] = useState(() => { try { return JSON.parse(localStorage.getItem('cet6_wordfavs') || '[]'); } catch (e) { return []; } });

  // —— 查词弹窗
  const [dictWord, setDictWord] = useState(null);
  const [dictPos, setDictPos] = useState({ x: 0, y: 0 });
  const [dictData, setDictData] = useState(null);   // null=加载中 | {phonetic,defs} | 'error'

  // 注册 ESC 切换 + 取词查释义
  appApi.toggleDisguise = () => setDisguise(d => !d);
  appApi.lookup = (word, x, y) => {
    setDictWord(word); setDictPos({ x, y }); setDictData(null);
    fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()))
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(arr => {
        const e0 = arr[0] || {};
        const phonetic = e0.phonetic || (e0.phonetics || []).map(p => p.text).find(Boolean) || '';
        const defs = [];
        (e0.meanings || []).forEach(m => (m.definitions || []).slice(0, 1).forEach(d => defs.push({ pos: m.partOfSpeech, def: d.definition, ex: d.example })));
        setDictData({ phonetic, defs: defs.slice(0, 3) });
      })
      .catch(() => setDictData('error'));
  };

  // 收藏:题目切换 + 单词/词组切换 + 跳转
  function toggleFav(id) {
    setFavs(f => { const n = f.includes(id) ? f.filter(x => x !== id) : [...f, id]; try { localStorage.setItem('cet6_favs', JSON.stringify(n)); } catch (e) {} return n; });
  }
  function toggleWordFav(term) {
    const t = term.trim(); if (!t) return;
    setWordFavs(f => { const n = f.includes(t) ? f.filter(x => x !== t) : [...f, t]; try { localStorage.setItem('cet6_wordfavs', JSON.stringify(n)); } catch (e) {} return n; });
  }
  function gotoFav(mode, idx) {
    if (mode === 'translate') { setTIndex(idx); setTHist([idx]); setTHp(0); setTPicked([]); setTShowWrong(false); setTRight(false); setTShuffle(makeShuffle(idx)); }
    else if (mode === 'pattern') { setPIndex(idx); setPHist([idx]); setPHp(0); setPChosen(null); }
    else if (mode === 'collocation') { setColIndex(idx); setColHist([idx]); setColHp(0); setColChosen(null); }
    else if (mode === 'templates') { setTmplIdx(idx); setTmplHist([idx]); setTmplHp(0); setTmplInput(''); setTmplChecked(false); }
    else if (mode === 'outline') { setOIndex(idx); setOHist([idx]); setOHp(0); setOInput(''); setORevealed(false); }
    setScreen(mode);
  }
  function enterFavorites() { setScreen('favorites'); }

  /* —— 通用答对/答错流程 —— */
  function correctFlow() {
    setTodayCount(c => c + 1);
    setCombo(c => {
      const nc = c + 1;
      if (nc === 5 || nc === 10 || (nc > 10 && nc % 10 === 0)) {
        playCombo();
        setComboMsg(nc >= 10 ? `⚡ ${nc} 连击!紫电狂飙!` : `✨ ${nc} 连击!渐入佳境!`);
        setTimeout(() => setComboMsg(null), 1400);
      }
      return nc;
    });
    setFx('correct');
    playCorrect();
    setTimeout(() => setFx(null), 700);
  }
  function wrongFlow() {
    setCombo(0);
    setFx('wrong');
    playWrong();
    setTimeout(() => setFx(null), 480);
  }

  /* —— 进入各模式 —— */
  function tLoad(ni) { setTIndex(ni); setTShuffle(makeShuffle(ni)); setTPicked([]); setTShowWrong(false); setTRight(false); }
  function enterTranslate() {
    const ni = rnd(TRANSLATIONS.length);
    setScreen('translate'); setTHist([ni]); setTHp(0); tLoad(ni);
  }
  function prevSentence() { if (tHp > 0) { setTHp(tHp - 1); tLoad(tHist[tHp - 1]); } }
  function enterPattern() { const ni = rnd(PATTERNS.length); setScreen('pattern'); setPHist([ni]); setPHp(0); setPIndex(ni); setPChosen(null); }
  function prevPattern() { if (pHp > 0) { setPHp(pHp - 1); setPIndex(pHist[pHp - 1]); setPChosen(null); } }
  function enterSynonym() { setScreen('synonym'); newBatch(rnd(SYNONYM_BATCHES.length)); }

  /* —— 翻译逻辑(按单词文本判对 → 两个相同的词换序也算对) —— */
  const tCur = TRANSLATIONS[tIndex];
  function nextSentence() {
    const r = histForward(tHist, tHp, TRANSLATIONS.length);
    setTHist(r.hist); setTHp(r.hp); tLoad(r.idx);
  }
  function retryTranslate() { setTShowWrong(false); setTPicked([]); }
  function pickBlock(pos) {
    if (tShowWrong || tRight) return;
    const np = [...tPicked, pos];
    setTPicked(np);
    if (np.length === tCur.tokens.length) {
      // 关键:逐位比较单词文本,而非原始下标 —— 重复词不区分顺序
      const ok = np.every((p, idx) => tShuffle[p].w === tCur.tokens[idx]);
      if (ok) { correctFlow(); setTRight(true); }  // 答对:展示考点,等用户点“下一句”
      else { wrongFlow(); setTShowWrong(true); }   // 不自动消失,留给用户看解释
    }
  }
  function undoBlock() {
    if (tShowWrong || tRight) return;
    setTPicked(p => p.slice(0, -1));
  }

  /* —— 句式逻辑 —— */
  const pCur = PATTERNS[pIndex];
  function nextPattern() {
    const r = histForward(pHist, pHp, PATTERNS.length);
    setPHist(r.hist); setPHp(r.hp); setPIndex(r.idx); setPChosen(null);
  }
  function chooseOption(opt) {
    if (pChosen) return;
    setPChosen(opt);
    if (opt === pCur.answer) {
      setPLit(arr => { const n = arr.slice(); n[pIndex] = true; return n; });
      correctFlow();   // 答对:展示讲解,等用户点“继续”
    } else {
      wrongFlow();
    }
  }

  /* —— 同义逻辑 —— */
  const sPairs = SYNONYM_BATCHES[sBatch];
  const sWords = sPairs.flatMap((p, pi) => p.map(w => ({ w, pi })));
  function newBatch(b) {
    setSBatch(b);
    setSOrder(shuffle([0, 1, 2, 3, 4, 5, 6, 7]));
    setSMatched(Array(8).fill(false));
    setSSel(null); setSWrongPair([]); setSDone(false); setSElapsed(0); setSHint(null);
    setSStart(Date.now());
  }
  function tapCard(i) {
    if (sMatched[i] || sDone || sWrongPair.length) return;
    if (sSel === null) { setSSel(i); return; }
    if (sSel === i) { setSSel(null); return; }
    if (sWords[sSel].pi === sWords[i].pi) {
      const nm = sMatched.slice(); nm[sSel] = true; nm[i] = true;
      setSMatched(nm); setSSel(null); setSHint(null);
      correctFlow();
      if (nm.every(Boolean)) {
        setSDone(true);
        setSElapsed((Date.now() - sStart) / 1000);
      }
    } else {
      const a = sWords[sSel], b = sWords[i];
      const pa = sPairs[a.pi].find(w => w !== a.w);
      const pb = sPairs[b.pi].find(w => w !== b.w);
      setSHint(`“${a.w}” 的同义词是 “${pa}”;“${b.w}” 的同义词是 “${pb}”`);
      setSWrongPair([sSel, i]); wrongFlow();
      setTimeout(() => { setSWrongPair([]); setSSel(null); }, 480);
      setTimeout(() => setSHint(null), 2400);
    }
  }

  /* —— 固定搭配逻辑 —— */
  function enterCollocation() { const ni = rnd(COLLOCATIONS.length); setScreen('collocation'); setColHist([ni]); setColHp(0); setColIndex(ni); setColChosen(null); }
  function prevCol() { if (colHp > 0) { setColHp(colHp - 1); setColIndex(colHist[colHp - 1]); setColChosen(null); } }
  const colCur = COLLOCATIONS[colIndex];
  function colNext() {
    const r = histForward(colHist, colHp, COLLOCATIONS.length);
    setColHist(r.hist); setColHp(r.hp); setColIndex(r.idx); setColChosen(null);
  }
  function colChoose(opt) {
    if (colChosen) return;
    setColChosen(opt);
    if (opt === colCur.answer) { correctFlow(); }  // 答对:展示搭配+释义,等用户点“继续”
    else { wrongFlow(); }
  }

  /* —— 作文模板逻辑(默写检查) —— */
  function enterTemplates() { const ni = rnd(ESSAY_TEMPLATES.length); setScreen('templates'); setTmplHist([ni]); setTmplHp(0); setTmplIdx(ni); setTmplInput(''); setTmplChecked(false); }
  function tmplGoNext() { const r = histForward(tmplHist, tmplHp, ESSAY_TEMPLATES.length); setTmplHist(r.hist); setTmplHp(r.hp); setTmplIdx(r.idx); setTmplInput(''); setTmplChecked(false); }
  function tmplPrev() { if (tmplHp > 0) { setTmplHp(tmplHp - 1); setTmplIdx(tmplHist[tmplHp - 1]); setTmplInput(''); setTmplChecked(false); } }
  function tmplCheck() {
    if (!tmplInput.trim()) return;
    setTmplChecked(true);
    const ok = tmplPerfect(tmplInput, ESSAY_TEMPLATES[tmplIdx].en);
    if (ok) { setTmplDone(a => { const n = a.slice(); n[tmplIdx] = true; return n; }); correctFlow(); }
    else { wrongFlow(); }
  }
  function tmplRetry() { setTmplChecked(false); setTmplInput(''); }
  function tmplMark() {   // 默写有出入但自认掌握 → 手动标记已背
    setTmplDone(a => { const n = a.slice(); n[tmplIdx] = true; return n; });
    tmplGoNext();
  }

  /* —— 作文构思逻辑(自己写思路 → 对照范例骨架) —— */
  function enterOutline() { const ni = rnd(ESSAY_OUTLINES.length); setScreen('outline'); setOHist([ni]); setOHp(0); setOIndex(ni); setOInput(''); setORevealed(false); }
  function oPrev() { if (oHp > 0) { setOHp(oHp - 1); setOIndex(oHist[oHp - 1]); setOInput(''); setORevealed(false); } }
  const oCur = ESSAY_OUTLINES[oIndex];
  function oNext() { const r = histForward(oHist, oHp, ESSAY_OUTLINES.length); setOHist(r.hist); setOHp(r.hp); setOIndex(r.idx); setOInput(''); setORevealed(false); }
  function oReveal() { if (oRevealed) return; setORevealed(true); correctFlow(); }
  function oRetry() { setORevealed(false); setOInput(''); }

  /* ====================== 渲染 ====================== */
  if (disguise) return Disguise();

  const fav = { favs, toggle: toggleFav };
  return h('div', { key: 'app', style: { maxWidth: '500px', margin: '0 auto', padding: '0 16px 40px', position: 'relative', minHeight: '100vh' } },
    Header({ todayCount, combo }),
    // 叠加层:固定槽位,内容增删不影响主体布局
    h('div', { key: 'overlay' },
      fx === 'correct' && ParticleBurst({ combo }),
      comboMsg && ComboBanner({ comboMsg }),
      combo >= 5 && EdgeGlow({ strong: combo >= 10 }),
      dictWord && WordPopup({ dictWord, dictPos, dictData, close: () => setDictWord(null), isWordFav: wordFavs.includes(dictWord), onToggleWordFav: () => toggleWordFav(dictWord) })
    ),
    // 屏幕层:key 随模式变化 → 仅切换模式时重建(播放入场动画),屏幕内操作只做增量更新
    h('div', { key: 'screen-' + screen },
      screen === 'menu' && Menu({ enterTranslate, enterPattern, enterSynonym, enterCollocation, enterTemplates, enterOutline, enterFavorites, pLit, tmplDone, favs, wordFavs }),
      screen === 'translate' && Translate({ tCur, tIndex, tShuffle, tPicked, tShowWrong, tRight, pickBlock, undoBlock, retryTranslate, nextSentence, setScreen, fx, fav, pos: tHp + 1, onPrev: prevSentence, canPrev: tHp > 0 }),
      screen === 'pattern' && Pattern({ pCur, pIndex, pLit, pChosen, chooseOption, nextPattern, setScreen, fx, fav, pos: pHp + 1, onPrev: prevPattern, canPrev: pHp > 0 }),
      screen === 'synonym' && Synonym({ sWords, sOrder, sMatched, sSel, sWrongPair, sDone, sElapsed, sBatch, sHint, tapCard, newBatch, setScreen, fx }),
      screen === 'collocation' && Collocation({ colCur, colIndex, colChosen, colChoose, colNext, setScreen, fx, fav, pos: colHp + 1, onPrev: prevCol, canPrev: colHp > 0 }),
      screen === 'templates' && Templates({ tmplIdx, tmplInput, tmplChecked, tmplDone, setTmplInput, tmplCheck, tmplRetry, tmplMark, tmplGoNext, setScreen, fx, fav, pos: tmplHp + 1, onPrev: tmplPrev, canPrev: tmplHp > 0 }),
      screen === 'outline' && Outline({ oCur, oIndex, oInput, oRevealed, setOInput, oReveal, oRetry, oNext, setScreen, fx, fav, pos: oHp + 1, onPrev: oPrev, canPrev: oHp > 0 }),
      screen === 'favorites' && Favorites({ favs, wordFavs, toggleFav, toggleWordFav, gotoFav, setScreen })
    )
  );
}

function makeShuffle(i) {
  return shuffle(TRANSLATIONS[i].tokens.map((w, oi) => ({ w, oi })));
}
// 随机下标(可排除某个值,避免和上一题重复)
function rnd(n, not) {
  if (n <= 1) return 0;
  let i; do { i = Math.floor(Math.random() * n); } while (i === not);
  return i;
}
// 历史前进:若已回看过有前进记录则沿用,否则随机一道新题(避开当前)
function histForward(hist, hp, N) {
  if (hp < hist.length - 1) return { idx: hist[hp + 1], hist: hist, hp: hp + 1 };
  const idx = rnd(N, hist[hp]);
  return { idx: idx, hist: hist.concat([idx]), hp: hp + 1 };
}
function shuffleOutline(i) {
  return shuffle(ESSAY_OUTLINES[i].steps.map((w, oi) => ({ w, oi })));
}
// 默写归一化:小写、去省略号占位、去标点、压空格 —— 用于比对默写是否正确
function normTmpl(s) {
  return String(s).toLowerCase().replace(/\.\.\./g, ' ').replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
// 编辑距离(Levenshtein)—— 用于默写宽松判分,容忍个别拼写差异
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
// 单词模糊相等:词越长容许的拼写误差越大(0~2 个编辑)
function fuzzyEq(u, t) {
  if (u === t) return true;
  const tol = t.length <= 3 ? 0 : t.length <= 6 ? 1 : 2;
  return lev(u, t) <= tol;
}
// 默写整体判对(宽松):词数一致且逐词模糊相等 —— 容忍个别拼写差异
function tmplPerfect(input, en) {
  const u = normTmpl(input).split(' ').filter(Boolean);
  const t = normTmpl(en).split(' ').filter(Boolean);
  return u.length === t.length && u.every((w, i) => fuzzyEq(w, t[i]));
}
// 取屏幕坐标处的英文单词(供长按/右键查词,无需给每个词包标签)
function wordAtPoint(x, y) {
  let range = null;
  if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
  else if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(x, y); if (p) { range = document.createRange(); range.setStart(p.offsetNode, p.offset); range.collapse(true); } }
  if (!range || range.startContainer.nodeType !== 3) return null;
  const text = range.startContainer.textContent, i = range.startOffset;
  const isW = c => c && /[A-Za-z'\-]/.test(c);
  let s = i, e = i;
  while (s > 0 && isW(text[s - 1])) s--;
  while (e < text.length && isW(text[e])) e++;
  const w = text.slice(s, e).replace(/^[-']+|[-']+$/g, '');
  return (w && /[A-Za-z]/.test(w)) ? w : null;
}

/* ============================================================
   模式①:翻译速拼
   ============================================================ */
function Translate({ tCur, tIndex, tShuffle, tPicked, tShowWrong, tRight, pickBlock, undoBlock, retryTranslate, nextSentence, setScreen, fx, fav, pos, onPrev, canPrev }) {
  const pickedSet = new Set(tPicked);
  // 第一个语序错误位置:按单词文本比较(相同的词换序不算错)
  const firstWrong = tShowWrong ? tPicked.findIndex((p, idx) => tShuffle[p].w !== tCur.tokens[idx]) : -1;
  return h('div', { style: { animation: 'riseIn .35s ease-out' } },
    SubBar({ title: '翻译速拼', sub: `本次第 ${pos} 题`, setScreen, favId: 'translate#' + tIndex, fav, onPrev, canPrev }),
    h('div', { style: { padding: '20px', borderRadius: '16px', border: BORDER, background: PANEL, marginBottom: '16px', boxShadow: SHADOW } },
      h('div', { style: { fontSize: '12px', color: MUTED, marginBottom: '8px' } }, '中文'),
      h('div', { style: { fontSize: '20px', lineHeight: 1.7, color: INK, fontWeight: '600' } }, tCur.zh)
    ),
    // 答题区
    h('div', { className: fx === 'correct' ? 'fx-correct' : (fx === 'wrong' ? 'fx-wrong' : ''),
      style: {
        minHeight: '72px', padding: '14px', borderRadius: '14px',
        border: tShowWrong ? '1px solid rgba(220,38,38,0.5)' : BORDER,
        background: tShowWrong ? 'rgba(220,38,38,0.04)' : 'rgba(124,58,237,0.04)', marginBottom: '16px',
        display: 'flex', flexWrap: 'wrap', gap: '8px', alignContent: 'flex-start'
      } },
      tPicked.length === 0
        ? h('span', { style: { color: MUTED, fontSize: '14px', alignSelf: 'center' } }, '点下方词块拼句,点已选词块可撤回')
        : tPicked.map((p, idx) =>
            h('button', { key: 'pk' + idx, onClick: () => idx === tPicked.length - 1 && undoBlock(),
              style: {
                padding: '9px 13px', borderRadius: '10px', fontSize: '16px', fontWeight: '700',
                border: (idx === firstWrong) ? '1px solid ' + RED : '1px solid rgba(124,58,237,0.4)',
                background: (idx === firstWrong) ? 'rgba(220,38,38,0.12)' : 'rgba(124,58,237,0.12)',
                color: (idx === firstWrong) ? RED : DEEP
              } }, tShuffle[p].w)
          )
    ),
    // 答对巩固面板(展示考点,停留约 2 秒)
    tRight && h('div', { key: 'tright', style: {
        padding: '14px', borderRadius: '14px', marginBottom: '16px', animation: 'riseIn .25s ease-out',
        background: 'rgba(22,163,74,0.08)', border: '1px solid rgba(22,163,74,0.4)' } },
      h('div', { style: { fontSize: '14px', color: GREEN, fontWeight: '800', marginBottom: '8px' } }, '✓ 正确!巩固一下考点'),
      h('div', { style: { fontSize: '15px', color: INK, lineHeight: 1.6, fontWeight: '700', marginBottom: '8px' } }, tCur.tokens.join(' ')),
      h('div', { style: { fontSize: '13px', color: INK, lineHeight: 1.7, padding: '10px 12px',
          background: 'rgba(124,58,237,0.06)', borderRadius: '10px' } }, '💡 ' + tCur.why),
      h('button', { onClick: nextSentence, style: { ...smallBtn(true), marginTop: '12px', width: '100%' } }, '下一句 →')
    ),
    // 答错解释面板
    tShowWrong && h('div', { key: 'twrong', style: {
        padding: '14px', borderRadius: '14px', marginBottom: '16px',
        background: 'rgba(220,38,38,0.05)', border: '1px solid rgba(220,38,38,0.3)' } },
      h('div', { style: { fontSize: '13px', color: RED, fontWeight: '800', marginBottom: '8px' } }, '✗ 语序有误'),
      h('div', { style: { fontSize: '12px', color: MUTED, marginBottom: '4px' } }, '正确答案'),
      h('div', { style: { fontSize: '16px', color: INK, lineHeight: 1.6, fontWeight: '700', marginBottom: '10px' } },
        tCur.tokens.join(' ')),
      h('div', { style: { fontSize: '13px', color: INK, lineHeight: 1.7, padding: '10px 12px',
          background: 'rgba(124,58,237,0.06)', borderRadius: '10px' } }, '💡 ' + tCur.why),
      h('div', { style: { display: 'flex', gap: '10px', marginTop: '12px' } },
        h('button', { onClick: retryTranslate, style: smallBtn(false) }, '↺ 再拼一次'),
        h('button', { onClick: nextSentence, style: smallBtn(true) }, '下一句 →')
      )
    ),
    // 词块池
    h('div', { key: 'tpool', style: { display: 'flex', flexWrap: 'wrap', gap: '10px' } },

    )
  );
}

      pCur.options.map(opt => {

          style: {

    ),

/* ============================================================
   模式③:同义替换
   ============================================================ */
function Synonym({ sWords, sOrder, sMatched, sSel, sWrongPair, sDone, sElapsed, sBatch, sHint, tapCard, newBatch, setScreen, fx }) {
  const rotations = [-4, 3, -2, 5, -5, 2, 4, -3];
  return h('div', { style: { animation: 'riseIn .35s ease-out' } },
    SubBar({ title: '同义替换', sub: `随机一批 · 4 对配对消除`, setScreen }),
    h('div', { style: { fontSize: '13px', color: MUTED, textAlign: 'center', marginBottom: '14px' } },
      '点击两个同义词配对 · 4 对全消即过关'),
    // 答错提示
    h('div', { style: {
        minHeight: '20px', textAlign: 'center', marginBottom: '12px',
        fontSize: '13px', fontWeight: '700', color: RED,
        opacity: sHint ? 1 : 0, transition: 'opacity .2s' } }, sHint || ' '),
    h('div', { style: {
        display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px',
        minHeight: '300px', marginBottom: '20px'
      } },
      sOrder.map((idx, slot) => {
        const word = sWords[idx];
        const matched = sMatched[idx];
        const selected = sSel === idx;
        const wrong = sWrongPair.includes(idx);
        if (matched) {
          return h('div', { key: 'sc' + idx, style: {
              padding: '22px 8px', borderRadius: '14px', textAlign: 'center',
              border: '1px solid rgba(22,163,74,0.3)', background: 'rgba(22,163,74,0.08)',
              opacity: 0.55, fontSize: '17px', color: GREEN, fontWeight: '700' } },
            '✓ ' + word.w);
        }
        return h('button', { key: 'sc' + idx, onClick: () => tapCard(idx),
          className: wrong ? 'fx-wrong' : '',
          style: {
            padding: '22px 8px', borderRadius: '14px', textAlign: 'center',
            fontSize: '18px', fontWeight: '700',
            transform: `rotate(${rotations[slot]}deg)`,
            border: selected ? '2px solid ' + PURPLE : wrong ? '2px solid ' + RED : BORDER,
            background: selected ? 'rgba(124,58,237,0.14)' : PANEL,
            color: selected ? DEEP : wrong ? RED : INK,
            boxShadow: selected ? '0 0 20px rgba(168,85,247,0.45)' : SHADOW
          } }, word.w);
      })
    ),
    sDone && h('div', { key: 'sdone', style: {
        padding: '18px', borderRadius: '16px', textAlign: 'center', marginBottom: '16px',
        border: '1px solid rgba(124,58,237,0.4)', background: 'rgba(124,58,237,0.08)',
        animation: 'riseIn .4s ease-out' } },
      h('div', { style: { fontSize: '16px', color: DEEP, fontWeight: '800' } }, '🎉 全部配对完成!'),
      h('div', { style: { fontSize: '14px', color: MUTED, marginTop: '8px' } },
        '用时 ', h('span', { style: { fontSize: '24px', fontWeight: '900', color: PURPLE } }, sElapsed.toFixed(1)), ' 秒')
    ),
    h('div', { key: 'sbtns', style: { display: 'flex', gap: '12px' } },
      sDone && h('button', { onClick: () => newBatch((sBatch + 1) % SYNONYM_BATCHES.length),
        style: bigBtn(true) }, '下一批 ›'),
      h('button', { onClick: () => newBatch(Math.floor(Math.random() * SYNONYM_BATCHES.length)),
        style: bigBtn(false) }, '🔀 换一批')
    )
  );
}

    )
  );
}

/* ============================================================
   紫光碎裂粒子
   ============================================================ */
function ParticleBurst({ combo }) {
  const n = combo >= 10 ? 22 : combo >= 5 ? 16 : 12;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    const dist = 80 + Math.random() * (combo >= 10 ? 150 : 90);
    parts.push(h('span', { key: 'p' + i, style: {
        position: 'absolute', left: '50%', top: '50%', width: '10px', height: '10px',
        marginLeft: '-5px', marginTop: '-5px', borderRadius: '2px',
        background: `linear-gradient(135deg, ${BRIGHT}, ${PURPLE})`,
        boxShadow: '0 0 8px rgba(168,85,247,0.9)',
        '--tx': Math.cos(ang) * dist + 'px',
        '--ty': Math.sin(ang) * dist + 'px',
        '--rot': (Math.random() * 540 - 270) + 'deg',
        animation: `shard ${0.6 + Math.random() * 0.3}s ease-out forwards`
      } }));
  }
  return h('div', { key: 'burst', style: {
      position: 'fixed', left: 0, right: 0, top: 0, bottom: 0,
      pointerEvents: 'none', zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center' } },
    h('div', { style: { position: 'relative', width: 0, height: 0 } },
      h('div', { style: {
          position: 'absolute', left: '50%', top: '50%', width: '60px', height: '60px',
          marginLeft: '-30px', marginTop: '-30px', borderRadius: '50%',
          border: `3px solid ${BRIGHT}`, animation: 'ringPulse .6s ease-out forwards' } }),
      ...parts
    )
  );
}

/* ============================================================

}
function EdgeGlow({ strong }) {

/* ============================================================

   ============================================================ */
function Collocation({ colCur, colIndex, colChosen, colChoose, colNext, setScreen, fx, fav, pos, onPrev, canPrev }) {
  const correct = colChosen && colChosen === colCur.answer;
  const wrong = colChosen && colChosen !== colCur.answer;
  const parts = colCur.q.split('___');
  return h('div', { style: { animation: 'riseIn .35s ease-out' } },
    SubBar({ title: '固定搭配', sub: `本次第 ${pos} 题`, setScreen, favId: 'collocation#' + colIndex, fav, onPrev, canPrev }),
    h('div', { className: fx === 'correct' ? 'fx-correct' : (fx === 'wrong' ? 'fx-wrong' : ''),
      style: { padding: '28px 20px', borderRadius: '16px', border: BORDER, background: PANEL, boxShadow: SHADOW, marginBottom: '16px', textAlign: 'center' } },
      h('div', { style: { fontSize: '13px', color: MUTED, marginBottom: '14px' } }, colCur.cn),
      h('div', { style: { fontSize: '24px', color: INK, fontWeight: '700', lineHeight: 1.6 } },
        parts[0],
        h('span', { style: { color: correct ? GREEN : wrong ? RED : PURPLE, fontWeight: '800', padding: '0 4px' } },
          correct ? colCur.answer : (colChosen || '____')),
        parts[1] || '')
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '16px' } },
      colCur.options.map(opt => {
        const isAns = colChosen && opt === colCur.answer;
        const isBad = wrong && opt === colChosen;
        return h('button', { key: opt, onClick: () => colChoose(opt),
          style: {
            padding: '16px', borderRadius: '14px', fontSize: '18px', fontWeight: '700',
            border: isAns ? '1px solid ' + GREEN : isBad ? '1px solid ' + RED : BORDER,
            background: isAns ? 'rgba(22,163,74,0.12)' : isBad ? 'rgba(220,38,38,0.1)' : PANEL,
            color: isAns ? GREEN : isBad ? RED : DEEP, boxShadow: SHADOW
          } }, opt);
      })
    ),
    correct && h('div', { key: 'colright', style: {
        padding: '14px', borderRadius: '14px', marginBottom: '4px', animation: 'riseIn .25s ease-out',
        background: 'rgba(22,163,74,0.08)', border: '1px solid rgba(22,163,74,0.4)' } },
      h('div', { style: { fontSize: '15px', color: GREEN, fontWeight: '800', marginBottom: '6px' } },
        '✓ 正确搭配:' + colCur.q.replace('___', colCur.answer)),
      h('div', { style: { fontSize: '13px', color: INK, marginBottom: '12px' } }, '释义:' + colCur.cn),
      h('button', { onClick: colNext, style: { ...smallBtn(true), width: '100%' } }, '继续 →')
    ),
    wrong && h('div', { key: 'colwrong', style: {
        padding: '14px', borderRadius: '14px', background: 'rgba(220,38,38,0.05)',
        border: '1px solid rgba(220,38,38,0.3)', animation: 'riseIn .25s ease-out' } },
      h('div', { style: { fontSize: '15px', color: RED, fontWeight: '800', marginBottom: '8px' } },
        '正确搭配:' + colCur.q.replace('___', colCur.answer)),
      h('div', { style: { fontSize: '13px', color: INK, marginBottom: '12px' } }, '释义:' + colCur.cn),
      h('button', { onClick: colNext, style: smallBtn(true) }, '继续 →')
    )
  );
}

/* ============================================================
   模式⑤:作文模板(默写检查)
   ============================================================ */
function Templates({ tmplIdx, tmplInput, tmplChecked, tmplDone, setTmplInput, tmplCheck, tmplRetry, tmplMark, tmplGoNext, setScreen, fx, fav, pos, onPrev, canPrev }) {
  const cur = ESSAY_TEMPLATES[tmplIdx];
  const done = tmplDone.filter(Boolean).length;
  const wordCount = cur.en.split(/\s+/).filter(w => !/^\.+$/.test(w)).length;
  const perfect = tmplChecked && tmplPerfect(tmplInput, cur.en);
  // 逐词比对(宽松):用户写对(含拼写相近)的词标绿,漏写/写错的标红下划线
  const userWords = normTmpl(tmplInput).split(' ').filter(Boolean);
  const diffWords = cur.en.split(/\s+/).map((w, i) => {
    const nw = w.toLowerCase().replace(/[^a-z]/g, '');
    if (nw === '') return h('span', { key: 'dw' + i, style: { color: MUTED } }, ' ____ ');
    const hit = userWords.some(uw => fuzzyEq(uw, nw));
    return h('span', { key: 'dw' + i, style: {
      color: hit ? GREEN : RED, fontWeight: '700',
      textDecoration: hit ? 'none' : 'underline', textDecorationStyle: 'wavy', marginRight: '5px'
    } }, w);
  });
  return h('div', { style: { animation: 'riseIn .35s ease-out' } },
    SubBar({ title: '作文模板默写', sub: `本次第 ${pos} 张 · 已背 ${done}/${ESSAY_TEMPLATES.length}`, setScreen, favId: 'templates#' + tmplIdx, fav, onPrev, canPrev }),
    h('div', { className: fx === 'correct' ? 'fx-correct' : (fx === 'wrong' ? 'fx-wrong' : ''),
      style: { padding: '20px', borderRadius: '16px', border: BORDER, background: PANEL, boxShadow: SHADOW, marginBottom: '14px' } },
      h('div', { style: { fontSize: '12px', color: PURPLE, fontWeight: '700', marginBottom: '12px' } },
        '【' + cur.cat + '】' + (tmplDone[tmplIdx] ? '  ✓ 已背' : '')),
      h('div', { style: { fontSize: '12px', color: MUTED, marginBottom: '6px' } }, `根据中文默写英文模板 · 约 ${wordCount} 词`),
      h('div', { style: { fontSize: '18px', color: INK, fontWeight: '600', lineHeight: 1.6, marginBottom: '14px' } }, cur.zh),
      h('textarea', { key: 'tmplinput', value: tmplInput, readonly: tmplChecked,
        oninput: (e) => setTmplInput(e.target.value),
        placeholder: '在此默写英文模板(空格处可写 … 或留空)…',
        style: {
          width: '100%', minHeight: '88px', padding: '12px 14px', borderRadius: '12px',
          border: BORDER, background: tmplChecked ? 'rgba(124,58,237,0.04)' : '#fff',
          color: INK, fontSize: '16px', lineHeight: 1.6, resize: 'vertical', outline: 'none',
          fontFamily: 'inherit'
        } })
    ),
    // 检查结果
    tmplChecked && h('div', { key: 'tmplresult', style: {
        padding: '14px', borderRadius: '14px', marginBottom: '14px', animation: 'riseIn .25s ease-out',
        background: perfect ? 'rgba(22,163,74,0.08)' : 'rgba(220,38,38,0.05)',
        border: '1px solid ' + (perfect ? 'rgba(22,163,74,0.4)' : 'rgba(220,38,38,0.3)') } },
      h('div', { style: { fontSize: '15px', fontWeight: '800', color: perfect ? GREEN : RED, marginBottom: '10px' } },
        perfect ? '✓ 完全正确!已计入已背' : '✗ 有出入,对照标准答案(绿=写对,红=漏写/写错)'),
      h('div', { style: { fontSize: '16px', lineHeight: 1.9, padding: '10px 12px', background: 'rgba(124,58,237,0.05)', borderRadius: '10px' } }, diffWords),
      h('div', { style: { fontSize: '13px', color: INK, marginTop: '10px' } }, '中文:' + cur.zh)
    ),
    // 操作按钮
    h('div', { key: 'tmplbtns', style: { display: 'flex', gap: '12px' } },
      !tmplChecked && h('button', { onClick: tmplCheck, disabled: !tmplInput.trim(),
        style: { ...bigBtn(true), opacity: tmplInput.trim() ? 1 : 0.5 } }, '✓ 检查默写'),
      tmplChecked && !perfect && h('button', { onClick: tmplRetry, style: bigBtn(false) }, '↺ 重写'),
      tmplChecked && !perfect && h('button', { onClick: tmplMark, style: bigBtn(true) }, '算我背对了 →'),
      tmplChecked && perfect && h('button', { onClick: tmplGoNext, style: bigBtn(true) }, '下一张 →')
    )
  );
}

    ),

      !oRevealed && h('button', { onClick: oReveal, disabled: !oInput.trim(),

      oRevealed && h('button', { onClick: oRetry, style: bigBtn(false) }, '↺ 重写'),

/* ============================================================
   我的收藏
   ============================================================ */
function favLabel(mode, idx) {
  if (mode === 'translate' && TRANSLATIONS[idx]) return { tag: '翻译', text: TRANSLATIONS[idx].zh };
  if (mode === 'pattern' && PATTERNS[idx]) return { tag: '句式', text: PATTERNS[idx].full };
  if (mode === 'collocation' && COLLOCATIONS[idx]) return { tag: '搭配', text: COLLOCATIONS[idx].q.replace('___', '___') + ' — ' + COLLOCATIONS[idx].cn };
  if (mode === 'templates' && ESSAY_TEMPLATES[idx]) return { tag: '模板', text: ESSAY_TEMPLATES[idx].zh + '  →  ' + ESSAY_TEMPLATES[idx].en };
  if (mode === 'outline' && ESSAY_OUTLINES[idx]) return { tag: '构思', text: ESSAY_OUTLINES[idx].topic };
  return { tag: '?', text: '(已失效)' };
}
function Favorites({ favs, wordFavs, toggleFav, toggleWordFav, gotoFav, setScreen }) {
  return h('div', { style: { animation: 'riseIn .35s ease-out' } },
    SubBar({ title: '我的收藏', sub: `${favs.length} 题 · ${wordFavs.length} 词 · 已本地保存`, setScreen }),
    (favs.length === 0 && wordFavs.length === 0)
      && h('div', { style: { textAlign: 'center', padding: '40px 20px', color: MUTED, fontSize: '14px', lineHeight: 1.9 } },
          '还没有收藏~\n题目:右上角点「☆ 收藏」。\n单词/词组:右键(电脑)或长按(手机)任意词,弹窗里点「☆ 加入生词本」;选中一段文字再操作可收藏词组。'),
    // 生词本
    wordFavs.length > 0 && h('div', { key: 'wsec', style: { marginBottom: '18px' } },
      h('div', { style: { fontSize: '13px', fontWeight: '800', color: DEEP, margin: '4px 0 10px' } }, '📒 生词本 / 词组'),
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '8px' } },
        wordFavs.map((w) => h('div', { key: 'wf' + w, style: {
            display: 'flex', alignItems: 'center', gap: '6px', padding: '7px 10px', borderRadius: '999px',
            border: BORDER, background: PANEL, boxShadow: SHADOW } },
          h('span', { style: { fontSize: '14px', fontWeight: '700', color: DEEP } }, w),

          h('button', { onClick: () => toggleWordFav(w), style: { border: 'none', background: 'transparent', color: MUTED, fontSize: '13px' } }, '✕')
        ))
      )
    ),
    // 题目收藏
    favs.length > 0 && h('div', { key: 'qsec' },
      h('div', { style: { fontSize: '13px', fontWeight: '800', color: DEEP, margin: '4px 0 10px' } }, '📌 题目收藏'),

            h('span', { style: { fontSize: '11px', fontWeight: '800', color: PURPLE, background: 'rgba(124,58,237,0.1)', padding: '3px 9px', borderRadius: '999px' } }, info.tag),
            h('button', { onClick: () => toggleFav(id), style: { border: 'none', background: 'transparent', color: MUTED, fontSize: '13px', fontWeight: '700' } }, '✕ 取消')),
          h('div', { style: { fontSize: '14px', color: INK, lineHeight: 1.6, marginBottom: '10px' } }, info.text),
          info.tag !== '?' && h('button', { onClick: () => gotoFav(mode, idx), style: smallBtn(true) }, '去练习 →')
        );
      })
    )
  );
}

/* ============================================================

function WordPopup({ dictWord, dictPos, dictData, close, isWordFav, onToggleWordFav }) {

  const vw = (window.innerWidth || 360), vh = (window.innerHeight || 640);

  return h('div', { key: 'dict' },
    h('div', { onClick: close, style: { position: 'fixed', inset: 0, zIndex: 80 } }),
    h('div', { style: {
        position: 'fixed', left: left + 'px', top: top + 'px', transform: 'translateX(-50%)', zIndex: 81,
        maxWidth: '280px', minWidth: '200px', padding: '14px 16px', borderRadius: '14px',
        background: '#fff', border: '1px solid rgba(124,58,237,0.3)', boxShadow: '0 10px 32px rgba(60,30,120,0.28)' } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' } },
        h('span', { style: { fontSize: '19px', fontWeight: '800', color: DEEP } }, dictWord),
        h('button', { onClick: close, style: { border: 'none', background: 'transparent', color: MUTED, fontSize: '16px' } }, '✕')),
      gloss && h('div', { style: { fontSize: '15px', color: INK, fontWeight: '600', marginBottom: '6px' } }, gloss),
      dictData === null && h('div', { style: { fontSize: '12px', color: MUTED } }, '联网查询中…'),
      dictData === 'error' && !gloss && h('div', { style: { fontSize: '12px', color: MUTED } }, '离线或未收录,可直接收藏'),
      dictData && dictData !== 'error' && h('div', null,
        dictData.phonetic && h('div', { style: { fontSize: '13px', color: PURPLE, marginBottom: '4px' } }, dictData.phonetic),
        ...dictData.defs.map((d, i) => h('div', { key: 'd' + i, style: { fontSize: '12px', color: INK, lineHeight: 1.5, marginTop: '4px' } },
          h('span', { style: { color: MUTED } }, (d.pos ? d.pos + '. ' : '')), d.def))
      ),
      h('button', { onClick: onToggleWordFav, style: {
          marginTop: '12px', width: '100%', padding: '9px', borderRadius: '10px', fontSize: '14px', fontWeight: '800',
          border: isWordFav ? '1px solid ' + PURPLE : 'none',

          color: isWordFav ? PURPLE : '#fff' } }, isWordFav ? '★ 已加入生词本(点击移除)' : '☆ 加入生词本')
    )
  );
}

/* ============================================================
   摸鱼伪装:假代码编辑器(保持深色,更像真在工作)
   ============================================================ */
function Disguise() {
  const lines = [
    { t: '// auth-service.ts — refactor token refresh flow', c: '#6a9955' },
    { t: "import { Logger } from '../utils/logger';", c: '#d4d4d4' },
